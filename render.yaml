# Render Blueprint: one web service (API + built React app) and one Postgres database.
databases:
  - name: ceees-db
    databaseName: ceees
    user: ceees
    plan: free            # free Postgres expires after 30 days; upgrade for real shops

services:
  - type: web
    name: ceees
    runtime: node
    plan: free
    # server/ and client/ each install their own dependencies
    buildCommand: npm install --prefix server && npm install --include=dev --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: ceees-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
